services:
  - type: web
    name: signal-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString

      - key: ENCRYPTION_KEY
        generateValue: true

      - key: APP_URL
        sync: false

      - key: OWNER_EMAIL
        sync: false

      - key: OWNER_PASSWORD
        sync: false

      - key: TEAM_NAME
        value: Studio Collective

      - key: CONNECTOR_ALLOWED_HOSTS
        value: ""

databases:
  - name: signal-db
    plan: free
    region: frankfurt
    databaseName: signal
    user: signal
    ipAllowList: []
