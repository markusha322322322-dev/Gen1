services:
  - type: web
    name: signal-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: node server/http.mjs
    healthCheckPath: /api/health
    preDeployCommand: node server/setup.mjs --bootstrap
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: TEAM_NAME
        value: Studio Collective
      - key: CONNECTOR_ALLOWED_HOSTS
        value: ""

  - type: worker
    name: signal-worker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: node server/worker.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: signal-api
          envVarKey: ENCRYPTION_KEY
      - key: CONNECTOR_ALLOWED_HOSTS
        value: ""

  - type: worker
    name: signal-scheduler
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: node server/scheduler.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString

databases:
  - name: signal-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: signal
    user: signal
    ipAllowList: []
